name: fork-publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-large
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: bun run build --single
        working-directory: packages/opencode

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ matrix.target }}
          path: packages/opencode/dist/opencode-*/bin/opencode*
          if-no-files-found: error

  publish-oci:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install oras
        run: |
          VERSION="1.2.0"
          curl -LO "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "oras_${VERSION}_linux_amd64.tar.gz"
          sudo mv oras /usr/local/bin/

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r .version packages/opencode/package.json)
          SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Prepare and push artifacts
        run: |
          REGISTRY="ghcr.io/${{ github.repository_owner }}/opencode"

          # Push each platform binary
          for dir in artifacts/opencode-*; do
            PLATFORM=$(basename "$dir" | sed 's/opencode-//')
            BINARY=$(find "$dir" -type f -name 'opencode*' | head -1)

            if [ -z "$BINARY" ]; then
              echo "No binary found in $dir"
              continue
            fi

            # Copy to current directory with clean name
            cp "$BINARY" "opencode"
            chmod +x "opencode"
            echo "Pushing $PLATFORM"

            oras push "${REGISTRY}:${{ steps.version.outputs.tag }}-${PLATFORM}" \
              --artifact-type application/vnd.opencode.binary \
              "opencode:application/octet-stream"

            # Also tag with just the platform for easy latest pull
            oras push "${REGISTRY}:${PLATFORM}" \
              --artifact-type application/vnd.opencode.binary \
              "opencode:application/octet-stream"

            rm opencode
          done

          # Create and push a manifest
          cat > manifest.json << EOF
          {
            "platforms": ["linux-x64", "linux-arm64", "darwin-arm64", "darwin-x64"],
            "version": "${{ steps.version.outputs.version }}",
            "commit": "${{ steps.version.outputs.sha }}"
          }
          EOF

          oras push "${REGISTRY}:${{ steps.version.outputs.tag }}" \
            --artifact-type application/vnd.opencode.manifest \
            manifest.json:application/json

          oras tag "${REGISTRY}:${{ steps.version.outputs.tag }}" latest
